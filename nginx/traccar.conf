# Include in nginx's http context (e.g. /etc/nginx/conf.d/traccar.conf).
# Load ngx_http_js_module in nginx.conf first, unless the package does it.
js_import reports from /etc/nginx/njs/reports.js;
js_set $report_archive reports.archive;
js_set $report_uri reports.upstreamUri;

map $http_origin $report_cors_origin {
    default $http_origin;
    '' '*';
}

map $report_archive $report_backend {
    0 http://127.0.0.1:8082;
    1 https://aadobrygc6wsyawaleatkimjjm0cczwu.lambda-url.us-east-1.on.aws;
}

map $report_archive $report_host {
    0 $host;
    1 aadobrygc6wsyawaleatkimjjm0cczwu.lambda-url.us-east-1.on.aws;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    # Dedicated Traccar origin: accept requests with any incoming Host header.
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name gps.frotaweb.com;

    # Replace with the server's trusted DNS resolver if different.
    resolver 1.1.1.1 1.0.0.1 valid=60s;
    resolver_timeout 5s;

    location ~ ^/(traccar/)?api/(reports/[^/]+|positions)$ {
        # Equivalent to DATABASE_RETENTION_WEEKS; shared by reports and positions.
        set $database_retention_weeks 2;
        proxy_pass $report_backend$report_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $report_host;
        proxy_set_header Connection "";
        proxy_ssl_server_name on;
        proxy_ssl_name $report_host;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 3;
        # Debian/Ubuntu CA bundle; adapt on other distributions.
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_read_timeout 300s;
        proxy_redirect off;
        proxy_cache off;
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        add_header Access-Control-Allow-Origin $report_cors_origin always;
        add_header Access-Control-Allow-Credentials 'true' always;
        add_header Vary Origin always;
    }

    location / {
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s;
        proxy_redirect off;
    }
}
